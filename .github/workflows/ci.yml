name: CI

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Confirm reset shell
        run: |
          test -f README.md
          test -f GOLD.md
          test ! -d src || (echo "Expected no src/ until you scaffold" && exit 1)
