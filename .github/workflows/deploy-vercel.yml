# Production only: push to `main` or manual workflow_dispatch.
# Secrets: repository-level (Settings → Secrets → Actions) — no GitHub Environments required.
#
# Repo: https://github.com/fh-gjudkins/FRUIT
name: Deploy (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-vercel-vite.yml
    with:
      production: true
      node-version: '22'
    secrets: inherit
