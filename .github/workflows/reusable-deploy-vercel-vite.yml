# -----------------------------------------------------------------------------
# Reusable: Vite SPA → Vercel (build in CI, deploy static `dist/`)
#
# Copy this file to another repo as:
#   .github/workflows/reusable-deploy-vercel-vite.yml
#
# Secrets: repository-level (Settings → Secrets and variables → Actions).
# Optional: attach a GitHub Environment on the *caller* job if you want protection rules later.
#
# Call from the same repo:
#   uses: ./.github/workflows/reusable-deploy-vercel-vite.yml
#
# Call from another repo (pin @tag or @sha):
#   uses: fh-gjudkins/FRUIT/.github/workflows/reusable-deploy-vercel-vite.yml@main
# -----------------------------------------------------------------------------
name: Reusable — Vercel deploy (Vite)

on:
  workflow_call:
    inputs:
      production:
        description: If true, runs `vercel deploy --prod` (maps to Production on Vercel)
        type: boolean
        required: true
      node-version:
        description: Node.js version for setup-node
        type: string
        required: false
        default: '22'
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true
      VITE_SUPABASE_URL:
        required: true
      VITE_SUPABASE_ANON_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite + TanStack route gen + tsc)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copy SPA rewrite config into dist
        run: cp vercel.json dist/vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.production }}" = "true" ]; then
            npx --yes vercel@latest deploy dist \
              --token "${{ secrets.VERCEL_TOKEN }}" \
              --yes \
              --prod
          else
            npx --yes vercel@latest deploy dist \
              --token "${{ secrets.VERCEL_TOKEN }}" \
              --yes
          fi
